name: OmniMow Code Quality and Static Analysis

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Load OmniMow environment variables from omnimow.env to GitHub Actions
      run: |
        grep -v '^#' system_setup/omnimow.env >> $GITHUB_ENV
      
    - name: Setup Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        #

    - name: Install testing tools and static analyzers
      run: |
        python -m pip install --upgrade pip
        pip install flake8
        sudo apt-get update && sudo apt-get install -y cppcheck shellcheck

    - name: Python Static Analysis (flake8)
      run: |
        # Stop pipeline on syntax errors or undefined variables in active Python modules
        flake8 stereo_vision/ depth_fusion/ docking_control/ app_backend/ video_stream/ --count --select=E9,F63,F7,F82 --show-source --statistics
        # Warnings and style checks (Remaining codebase)
        flake8 stereo_vision/ depth_fusion/ docking_control/ app_backend/ video_stream/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: C++ Firmware Analysis (cppcheck)
      run: |
        cppcheck --enable=all --suppress=missingIncludeSystem ./esp32_code/

    - name: Shell Script Analysis (shellcheck)
      run: |
        # Static analysis of host setup and startup scripts
        shellcheck system_setup/host_setup.sh stereo_vision/start_vision.sh
