name: OmniMow Release

# Makes a GitHub release from main. Every mower checks for a new release (update_software.sh) and
# the app offers to install it. Start it under Actions -> OmniMow Release -> Run workflow, or push
# a tag (git tag v1.2.0 && git push origin v1.2.0). The release notes list the changes since the
# previous release and are shown in the app; write your own text in "notes" to put it first.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. v1.2.0 (empty: v<year>.<month>.<day>-<run number>)"
        required: false
      notes:
        description: "What is new (shown in the app above the list of changes)"
        required: false
  push:
    tags: [ "v*" ]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout main
      uses: actions/checkout@v4
      with:
        ref: ${{ github.ref_type == 'tag' && github.ref || 'main' }}
        fetch-depth: 0

    - name: Create the release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        VERSION: ${{ inputs.version }}
        NOTES: ${{ inputs.notes }}
      run: |
        if [ "${{ github.ref_type }}" = tag ]; then
          tag="${{ github.ref_name }}"
          # A release is made from main only
          git merge-base --is-ancestor "$tag" origin/main || { echo "$tag is not on main"; exit 1; }
        else
          tag="${VERSION:-v$(date -u +%Y.%m.%d)-${{ github.run_number }}}"
        fi
        args=(--target "$(git rev-parse HEAD)" --title "OmniMow $tag" --generate-notes)
        [ -n "$NOTES" ] && args+=(--notes "$NOTES")
        gh release create "$tag" "${args[@]}"
        echo "Released $tag from main ($(git rev-parse --short HEAD))"
