name: OmniMow Docker Build and Publish

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-images:
    # In a private repository this only runs when started by hand (Actions -> Run workflow), so
    # it uses no Actions minutes by itself. Public repositories (free minutes) run it on every push.
    if: ${{ !github.event.repository.private || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [stereo_vision, depth_fusion, docking_control, app_backend, rosbridge_websocket, video_stream]
    steps:
    - name: Checkout source code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Convert repository path to lowercase
      run: |
        echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

    - name: Setup QEMU (Enable cross-compilation to arm64)
      uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

    - name: Log in to GHCR (GitHub Container Registry)
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Compile and publish ${{ matrix.service }} Docker Image
      uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
      with:
        context: ./${{ matrix.service }}
        platforms: linux/arm64
        push: true
        tags: ghcr.io/${{ env.REPO_LC }}/${{ matrix.service }}:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
