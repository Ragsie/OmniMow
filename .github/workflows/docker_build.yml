name: OmniMow Docker Build and Publish

on:
  push:
    branches: [ "main" ]

jobs:
  build-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [stereo_vision, depth_fusion, docking_control, app_backend, rosbridge_websocket]
    steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    #
    - name: Convert repository path to lowercase
      run: |
        echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

    - name: Setup QEMU (Enable cross-compilation to arm64)
      uses: docker/setup-qemu-action@v3

    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GHCR (GitHub Container Registry)
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Compile and publish ${{ matrix.service }} Docker Image
      uses: docker/build-push-action@v5
      with:
        context: ./${{ matrix.service }}
        platforms: linux/arm64
        push: true
        tags: ghcr.io/${{ env.REPO_LC }}/${{ matrix.service }}:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max