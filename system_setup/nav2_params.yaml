# ==============================================================================
# OmniMow ROS 2 Navigation2 (Nav2) Parameterkonfiguration
# Optimized for Radxa Dragon Q6A & GXIVISION 3D Stereo Virtual LiDAR scan
# ==============================================================================

amcl:
  ros__parameters:
    use_sim_time: False
    # Note: AMCL is bypassed in OmniMow's active RTK-GPS navigation setup,
    # as position and TF transforms are published directly by FusionCore (UKF).

bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: map
    robot_base_frame: base_link
    odom_frame: odom
    default_bt_xml_filename: "navigate_to_pose_w_replanning_and_recovery.xml"
    plugin_lib_names:
      - nav2_back_up_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_recompute_path_to_pose_action_bt_node
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_follow_path_action_bt_node

controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    # Progress Checker
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    # Goal Checker (Centimeter precision matched with RTK-GPS)
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.05  # 5 cm goal tolerance (RTK precision enables this!)
      yaw_goal_tolerance: 0.08 # Ca. 4.5 graders vinkeltolerance

    # Goal Checker (Centimeter precision matched with RTK-GPS)
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.05  # 5 cm goal tolerance (RTK precision enables this!)
      yaw_goal_tolerance: 0.08 # Ca. 4.5 graders vinkeltolerance

    # RPP-guided velocity and steering parameters for asymmetric Worx chassis:
    # We reduce max linear speed slightly for higher precision near obstacles.
    # Lookahead_dist adapts dynamically for smoother path snapping.
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.38  # Reduced from 0.45 for improved control during asymmetric turns
      lookahead_dist: 0.5       # Reduced from 0.6 to react faster near boundaries
      min_lookahead_dist: 0.25  # Reduced from 0.3 for tight turns near flower beds
      max_lookahead_dist: 0.8
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 0.30
      transform_tolerance: 0.1
      use_velocity_scaled_lookahead_dist: True
      use_regulated_linear_velocity_scaling: True
      regulated_linear_scaling_min_radius: 0.8
      regulated_linear_scaling_min_speed: 0.12 # Reduced speed in sharp turns to prevent turf damage
      use_cost_regulated_linear_velocity_scaling: True
      cost_scaling_dist: 0.5                  # Increased from 0.4 - initiate deceleration earlier
      cost_scaling_factor: 12.0               # More sensitive braking near obstacles and corners
      inflation_cost_scaling_factor: 4.0

planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    use_sim_time: False
    planner_plugins: ["GridBased"]

    # Global path planner (Grid-based NavFn - robust and fast on QCS6490)
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.1
      use_astar: True # Use A* search algorithm instead of Dijkstra for lower CPU load

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: False
      robot_radius: {ROBOT_RADIUS} # # Worx Landroid M600 physical radius (incl. margin)
      resolution: 0.05   # 5 cm grid resolution
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      
      # Obstacle mapping based on Virtual LiDAR scan
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 1.5
          min_obstacle_height: 0.05
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.1
          obstacle_max_range: 2.2 # Keep mower focused on close obstacles
          obstacle_min_range: 0.1
      
      # Inflation layer (obstacle proximity margin)
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 8.0
        inflation_radius: {INFLATION_RADIUS} # # Gives approx 7-10 cm safety margin beyond robot radius

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: False
      rolling_window: True
      width: 4.0   # 4 x 4 meter local window around mower
      height: 4.0
      resolution: 0.05
      robot_radius: {ROBOT_RADIUS} #
      plugins: ["obstacle_layer", "inflation_layer"]
      
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 1.5
          min_obstacle_height: 0.05
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.1
          obstacle_max_range: 2.2
          obstacle_min_range: 0.1
      
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 8.0
        inflation_radius: {INFLATION_RADIUS} #

recoveries_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    recovery_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_recoveries/Spin"
    backup:
      plugin: "nav2_recoveries/BackUp"
    wait:
      plugin: "nav2_recoveries/Wait"

robot_navigator:
  ros__parameters:
    use_sim_time: False